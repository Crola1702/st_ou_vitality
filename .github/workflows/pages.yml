name: Deploy vitality dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - vitality_dashboard.html
      - university_report.html
      - society_report.html
      - report_builder.html
      - r9/dashboards/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp vitality_dashboard.html _site/index.html
          # Also under its own name: the report builder links back to it.
          cp vitality_dashboard.html _site/vitality_dashboard.html
          if [ -f vitality_report.csv ]; then
            cp vitality_report.csv _site/vitality_report.csv
          fi
          if [ -f university_report.html ]; then
            cp university_report.html _site/university_report.html
          fi
          for f in society_report.html report_builder.html; do
            if [ -f "$f" ]; then
              cp "$f" "_site/$f"
            fi
          done
          # Region 9 dashboards (beta): served as-is under /beta_r9/, so the
          # section picker's relative links keep working.
          if [ -d r9/dashboards ]; then
            cp -r r9/dashboards _site/beta_r9
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
