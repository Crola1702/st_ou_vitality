name: Deploy vitality dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - vitality_dashboard.html
      - university_report.html
      - society_report.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp vitality_dashboard.html _site/index.html
          if [ -f vitality_report.csv ]; then
            cp vitality_report.csv _site/vitality_report.csv
          fi
          if [ -f university_report.html ]; then
            cp university_report.html _site/university_report.html
          fi
          if [ -f society_report.html ]; then
            cp society_report.html _site/society_report.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
